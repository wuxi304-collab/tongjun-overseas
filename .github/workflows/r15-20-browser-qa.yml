name: R15.21 browser visual QA
# QA refresh: R15.21 homepage mobile density verification

on:
  push:
    branches: [qa/r15.20-browser-screenshots]
    paths:
      - '.github/workflows/r15-20-browser-qa.yml'

permissions:
  contents: write

concurrency:
  group: r15-21-browser-qa
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/r15.20-browser-screenshots
          fetch-depth: 1

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Capture 1440 and 390 viewport screenshots
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
          BASE: https://wuxi304-collab.github.io/tongjun-overseas
        run: |
          set -euo pipefail
          rm -rf visual-qa/r15-21
          mkdir -p visual-qa/r15-21

          capture() {
            slug="$1"
            url="$2"

            "$CHROME"               --headless=new               --no-sandbox               --disable-gpu               --hide-scrollbars               --force-device-scale-factor=1               --run-all-compositor-stages-before-draw               --virtual-time-budget=2500               --window-size=1440,1000               --screenshot="visual-qa/r15-21/${slug}-1440.png"               "$url"

            "$CHROME"               --headless=new               --no-sandbox               --disable-gpu               --hide-scrollbars               --force-device-scale-factor=1               --run-all-compositor-stages-before-draw               --virtual-time-budget=2500               --window-size=390,844               --screenshot="visual-qa/r15-21/${slug}-390.png"               "$url"
          }

          capture home "$BASE/"
          capture technical-data "$BASE/technical-data.html"
          capture standards "$BASE/standards.html"
          capture titanium "$BASE/titanium-heat-exchangers.html"
          capture invar "$BASE/resource-invar-lng-vs-tooling.html"

          for f in visual-qa/r15-21/*.png; do
            test -s "$f"
            file "$f"
          done

      - name: Dump final footer DOM
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
          BASE: https://wuxi304-collab.github.io/tongjun-overseas
        run: |
          set -euo pipefail
          "$CHROME" --headless=new --no-sandbox --disable-gpu --dump-dom "$BASE/" > "$RUNNER_TEMP/home-dom.html"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=(Path(os.environ["RUNNER_TEMP"])/"home-dom.html").read_text(encoding="utf-8")
          m=re.search(r'(<footer class="footer">.*?</footer>)',s,re.S)
          if not m:
              raise SystemExit("footer not found")
          out=Path("visual-qa/r15-21/footer-dom.html")
          out.write_text(m.group(1),encoding="utf-8")
          print(m.group(1))
          PY

      - name: Build screenshot contact-sheet PDF
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          cat > "$RUNNER_TEMP/r15-21-contact.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <style>
            @page { size: A4 landscape; margin: 10mm; }
            * { box-sizing: border-box; }
            body { margin: 0; font-family: Arial, sans-serif; background: white; color: #111; }
            .page { page-break-after: always; display:grid; grid-template-columns: 1fr 310px; gap: 12mm; align-items:start; }
            h1 { grid-column:1/-1; font-size:18px; margin:0 0 4mm; }
            figure { margin:0; }
            img { width:100%; height:auto; border:1px solid #bbb; display:block; }
            .mobile img { width:260px; margin:0 auto; }
            figcaption { font-size:10px; margin-top:2mm; color:#555; }
          </style>
          HTML
          for slug in home technical-data standards titanium invar; do
            cat >> "$RUNNER_TEMP/r15-21-contact.html" <<HTML
          <section class="page">
            <h1>${slug} · R15.21 actual Chrome capture</h1>
            <figure><img src="file://$ROOT/visual-qa/r15-21/${slug}-1440.png"><figcaption>1440 × 1000</figcaption></figure>
            <figure class="mobile"><img src="file://$ROOT/visual-qa/r15-21/${slug}-390.png"><figcaption>390 × 844</figcaption></figure>
          </section>
          HTML
          done
          "$CHROME"             --headless=new             --no-sandbox             --disable-gpu             --allow-file-access-from-files             --print-to-pdf-no-header             --print-to-pdf="visual-qa/r15-21/contact-sheet.pdf"             "file://$RUNNER_TEMP/r15-21-contact.html"
          test -s visual-qa/r15-21/contact-sheet.pdf
          file visual-qa/r15-21/contact-sheet.pdf

      - name: Collect real-browser layout metrics
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
          BASE: https://wuxi304-collab.github.io/tongjun-overseas
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/measure-layout.mjs" <<'JS'
          import fs from 'node:fs/promises';

          const base = process.env.BASE;
          const pages = {
            home: '/',
            technicalData: '/technical-data.html',
            standards: '/standards.html',
            titanium: '/titanium-heat-exchangers.html',
            invar: '/resource-invar-lng-vs-tooling.html'
          };

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          class CDP {
            constructor(ws) {
              this.ws = ws;
              this.id = 0;
              this.pending = new Map();
              ws.onmessage = ev => {
                const msg = JSON.parse(ev.data);
                if (msg.id && this.pending.has(msg.id)) {
                  const {resolve, reject} = this.pending.get(msg.id);
                  this.pending.delete(msg.id);
                  msg.error ? reject(new Error(JSON.stringify(msg.error))) : resolve(msg.result);
                }
              };
            }
            send(method, params={}) {
              return new Promise((resolve, reject) => {
                const id = ++this.id;
                this.pending.set(id, {resolve, reject});
                this.ws.send(JSON.stringify({id, method, params}));
              });
            }
          }

          async function connect() {
            const tabs = await fetch('http://127.0.0.1:9222/json').then(r => r.json());
            const tab = tabs.find(t => t.type === 'page');
            const ws = new WebSocket(tab.webSocketDebuggerUrl);
            await new Promise((resolve, reject) => {
              ws.onopen = resolve;
              ws.onerror = reject;
            });
            return new CDP(ws);
          }

          const expr = String.raw`(() => {
            const R = el => {
              if (!el) return null;
              const r = el.getBoundingClientRect();
              return {x:+r.x.toFixed(1), y:+r.y.toFixed(1), width:+r.width.toFixed(1), height:+r.height.toFixed(1), bottom:+r.bottom.toFixed(1)};
            };
            const S = el => el ? getComputedStyle(el) : null;
            const hero = document.querySelector('main > .hero, main > .pagehero, main > .tech-hero, main section.hero, main section.pagehero, main section.tech-hero');
            const h1 = document.querySelector('h1');
            const lead = hero?.querySelector('.lead, p');
            const hs = S(h1);
            const hr = R(h1);
            const fs = hs ? parseFloat(hs.fontSize) : 0;
            let lh = hs ? parseFloat(hs.lineHeight) : 0;
            if (!Number.isFinite(lh)) lh = fs * 1.08;
            const allSections = [...document.querySelectorAll('main > section')].map((el,i) => ({
              i,
              className: el.className,
              rect: R(el)
            }));
            const actionbar = document.querySelector('.mobile-actionbar');
            const prefooter = document.querySelector('.prefooter');
            const footer = document.querySelector('footer.footer');
            const header = document.querySelector('.site-header');
            const ctas = [...document.querySelectorAll('a.cta, button.cta, .rfq-btn, .route-btn')].map(el => ({
              text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,80),
              rect:R(el),
              display:S(el)?.display,
              visibility:S(el)?.visibility
            }));
            const visibleCtas = ctas.filter(x => x.rect && x.rect.bottom > 0 && x.rect.y < innerHeight && x.display !== 'none' && x.visibility !== 'hidden');
            const overflow = [...document.querySelectorAll('body *')].filter(el => {
              const r = el.getBoundingClientRect();
              return r.right > innerWidth + 1 || r.left < -1;
            }).slice(0,20).map(el => ({
              tag:el.tagName,
              className:el.className,
              rect:R(el)
            }));
            const firstViewportText = [...document.querySelectorAll('main *')].filter(el => {
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return r.height > 0 && r.bottom > 0 && r.top < innerHeight && s.display !== 'none' && s.visibility !== 'hidden' && el.children.length === 0;
            }).reduce((n,el)=>n+((el.textContent||'').trim().length),0);
            return {
              url: location.href,
              viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio},
              document:{scrollWidth:document.documentElement.scrollWidth, clientWidth:document.documentElement.clientWidth, scrollHeight:document.documentElement.scrollHeight},
              header:R(header),
              hero:R(hero),
              heroViewportRatio: hero ? +(hero.getBoundingClientRect().height/innerHeight).toFixed(3) : null,
              h1:{text:(h1?.textContent||'').trim().replace(/\s+/g,' '), rect:hr, fontSize:fs, lineHeight:+lh.toFixed(1), lines:hr&&lh?+((hr.height/lh).toFixed(2)):null},
              lead:R(lead),
              sections:allSections,
              prefooter:R(prefooter),
              footer:R(footer),
              footerComputed: footer ? {
                paddingTop:S(footer).paddingTop,
                paddingBottom:S(footer).paddingBottom,
                minHeight:S(footer).minHeight,
                height:S(footer).height
              } : null,
              footerGrid:(() => {
                const el=document.querySelector('.footer .v13-footgrid, .footer .footgrid');
                if(!el) return null;
                const cs=S(el);
                return {
                  rect:R(el),
                  gridTemplateColumns:cs.gridTemplateColumns,
                  gridTemplateRows:cs.gridTemplateRows,
                  columnGap:cs.columnGap,
                  rowGap:cs.rowGap,
                  children:[...el.children].map(ch=>({
                    tag:ch.tagName,
                    className:ch.className,
                    rect:R(ch),
                    display:S(ch).display,
                    minHeight:S(ch).minHeight,
                    height:S(ch).height
                  }))
                };
              })(),
              footerBrand:(() => {
                const root=document.querySelector('.footer .footer-brand');
                if(!root) return null;
                const brand=root.querySelector('.brand');
                const mark=root.querySelector('.mark,svg,img');
                const copy=root.querySelector('p');
                const loc=root.querySelector('.footer-location');
                return {root:R(root),brand:R(brand),mark:R(mark),copy:R(copy),location:R(loc)};
              })(),
              footerLegal:R(document.querySelector('.footer .legal')),
              actionbar:R(actionbar),
              visibleCTAcount:visibleCtas.length,
              visibleCTAs:visibleCtas,
              totalCTAcount:ctas.length,
              horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
              overflowElements:overflow,
              firstViewportTextChars:firstViewportText
            };
          })()`;

          async function collect(width, height) {
            const cdp = await connect();
            await cdp.send('Page.enable');
            await cdp.send('Runtime.enable');
            await cdp.send('Emulation.setDeviceMetricsOverride', {width,height,deviceScaleFactor:1,mobile:false});
            const out = {};
            for (const [name,path] of Object.entries(pages)) {
              await cdp.send('Page.navigate', {url: base + path});
              await sleep(2200);
              const res = await cdp.send('Runtime.evaluate', {expression:expr, returnByValue:true, awaitPromise:true});
              out[name] = res.result.value;
            }
            return out;
          }

          const result = {
            generatedAt:new Date().toISOString(),
            desktop:await collect(1440,1000),
            mobile:await collect(390,844)
          };
          await fs.writeFile('visual-qa/r15-21/layout-metrics.json', JSON.stringify(result,null,2));
          process.exit(0);
          JS

          "$CHROME"             --headless=new             --no-sandbox             --disable-gpu             --remote-debugging-port=9222             --remote-allow-origins='*'             --user-data-dir="$RUNNER_TEMP/chrome-metrics"             about:blank >"$RUNNER_TEMP/chrome-metrics.log" 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 0.2
          done

          node "$RUNNER_TEMP/measure-layout.mjs"
          test -s visual-qa/r15-21/layout-metrics.json
          python3 -m json.tool visual-qa/r15-21/layout-metrics.json >/dev/null
          kill "$CHROME_PID" 2>/dev/null || true
          trap - EXIT

      - name: Upload visual QA review packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r15-21-visual-qa
          path: |
            visual-qa/r15-21/contact-sheet.pdf
            visual-qa/r15-21/*.png
          retention-days: 7
          if-no-files-found: error

      - name: Commit visual QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tongjun-visual-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add visual-qa/r15-21
          git commit -m "qa: capture R15.21 1440 and 390 browser screenshots"
          git push origin HEAD:qa/r15.20-browser-screenshots
