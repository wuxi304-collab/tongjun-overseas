name: Package R15.26 Tencent Lighthouse

on:
  push:
    branches:
      - feat/v34.152-r15.24-home-hero-background
    paths:
      - .github/workflows/package-r15-26-tencent.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v34.152-r15.26-tencent-lighthouse
          fetch-depth: 0

      - name: Validate release
        run: |
          set -euo pipefail
          npm run build:production
          npm run check:selfhosted

      - name: Assemble project ZIP
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          NAME="tongjun-overseas-r15.26-tencent-lighthouse"
          printf '%s\n' "$SHA" > RELEASE_PACKAGE_SHA
          cat > PACKAGE_INFO.txt <<EOF
          Tongjun Overseas / exoticalloycn.com
          Release: V34.152 R15.26
          Deployment target: Tencent Cloud Lighthouse
          Source branch: release/v34.152-r15.26-tencent-lighthouse
          Source commit: $SHA
          Visual release: V34.152 R15.7
          Homepage HERO: V34.152 R15.24
          Production static artifact: _prod/
          Deployment guide: deploy/tencent/README.md
          No real credentials or secrets are included.
          EOF

          rm -rf "/tmp/$NAME" "/tmp/$NAME.zip"
          mkdir -p "/tmp/$NAME"
          rsync -a ./ "/tmp/$NAME/" \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.DS_Store' \
            --exclude='*.log'

          cd /tmp
          zip -q -r -9 "$NAME.zip" "$NAME"
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          ls -lh "$NAME.zip"
          cat "$NAME.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tongjun-overseas-r15.26-tencent-lighthouse
          path: |
            /tmp/tongjun-overseas-r15.26-tencent-lighthouse.zip
            /tmp/tongjun-overseas-r15.26-tencent-lighthouse.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable package branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/deliverable
          cp /tmp/tongjun-overseas-r15.26-tencent-lighthouse.zip /tmp/deliverable/
          cp /tmp/tongjun-overseas-r15.26-tencent-lighthouse.zip.sha256 /tmp/deliverable/

          git config user.name 'tongjun-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout --orphan deliverables-r15-26-tencent
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/deliverable/* .
          git add tongjun-overseas-r15.26-tencent-lighthouse.zip \
                  tongjun-overseas-r15.26-tencent-lighthouse.zip.sha256
          git commit -m 'deliverable: R15.26 Tencent Lighthouse project ZIP'
          git push -f origin HEAD:deliverables/r15.26-tencent-package
