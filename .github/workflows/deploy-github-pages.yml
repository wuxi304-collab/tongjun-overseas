name: Deploy temporary GitHub Pages mirror
# refresh: recover canonical industrial images from preserved binary sync archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-github-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V34.152 brand migration
        uses: actions/checkout@v6
        with:
          ref: v34.152-brand-migration
          fetch-depth: 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Recover preserved industrial image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images /tmp/tj-v27-bin/full
          : > /tmp/tj-v27-bin/archive.tar.xz
          for f in $(find .sync/v27-bin -maxdepth 1 -type f -name 'chunk*.b64' | sort -V); do
            base64 --decode "$f" >> /tmp/tj-v27-bin/archive.tar.xz
          done
          xz -t /tmp/tj-v27-bin/archive.tar.xz
          tar -xJf /tmp/tj-v27-bin/archive.tar.xz -C /tmp/tj-v27-bin/full
          find /tmp/tj-v27-bin/full -type f -path '*/assets/images/*.webp' -print
          while IFS= read -r f; do cp "$f" assets/images/; done < <(find /tmp/tj-v27-bin/full -type f -path '*/assets/images/*.webp')
          for img in about-engineering heavy-plate invar-lng invar-tooling logistics-stock nickel-alloys og-cover precision-strip quality-inspection resources-metal standards-rfq titanium-zirconium traceability-pmi; do
            test -s "assets/images/$img.webp"
          done
          echo 'PASS: preserved industrial image set recovered into assets/images.'
      - name: Apply unified Tongjun brand shell
        run: python3 scripts/apply-brand-shell-v34-152.py
      - name: Build Pages mirror
        shell: bash
        env:
          BASE_PATH: /tongjun-overseas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,shutil
          root=Path('.'); out=Path('_site'); base=os.environ.get('BASE_PATH','/tongjun-overseas').rstrip('/')
          if out.exists(): shutil.rmtree(out)
          out.mkdir()
          skip={'.git','.github','.sync','node_modules','scripts','tests','api','_site'}
          text_ext={'.html','.css','.js','.json','.xml','.txt','.webmanifest','.svg'}
          keep_ext=text_ext|{'.ico','.png','.jpg','.jpeg','.webp','.woff','.woff2','.ttf'}
          for p in root.rglob('*'):
            if not p.is_file(): continue
            rel=p.relative_to(root)
            if rel.parts and rel.parts[0] in skip: continue
            if p.suffix.lower() not in keep_ext and p.name not in {'robots.txt','sitemap.xml','manifest.webmanifest'}: continue
            d=out/rel; d.parent.mkdir(parents=True,exist_ok=True)
            if p.suffix.lower() in text_ext:
              try: t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: shutil.copy2(p,d); continue
              t=re.sub(r'(["\'])/(?!/)',lambda m:m.group(1)+base+'/',t)
              t=re.sub(r'url\((/)(?!/)',lambda m:'url('+base+'/',t)
              d.write_text(t,encoding='utf-8')
            else: shutil.copy2(p,d)
          (out/'.nojekyll').write_text('',encoding='utf-8')
          PY
      - name: Validate full-site brand convergence
        run: |
          set -euo pipefail
          for f in index.html materials.html product-forms.html technical-data.html quality.html about.html rfq.html resources.html nickel-alloys.html precision-strip.html heavy-plate.html; do
            test -f "_site/$f"
            grep -q 'brand-v34.152.css' "_site/$f"
            grep -q 'brand-v34.152-r2.css' "_site/$f"
            grep -q 'brand-v34.152.js' "_site/$f"
          done
          grep -q 'Never show the fabricated portrait/student mark' _site/assets/brand-v34.152.css
          grep -q 'V34.152 R2' _site/assets/brand-v34.152-r2.css
          grep -q 'hero h1{color:#fff' _site/assets/brand-v34.152-r2.css
          for img in about-engineering heavy-plate invar-lng invar-tooling logistics-stock nickel-alloys og-cover precision-strip quality-inspection resources-metal standards-rfq titanium-zirconium traceability-pmi; do
            test -s "_site/assets/images/$img.webp"
          done
          grep -q 'technical_review_plan' _site/rfq.html
          grep -q 'release_checklist' _site/rfq.html
          echo 'PASS: recovered images, R2 hierarchy, sitewide shell and RFQ workflow validated.'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
