name: Deploy temporary GitHub Pages mirror
# V34.152 R13.1 SAFE — composite brand + stable R12 imagery + hardened Pages path rewriting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-github-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V34.152 R13.1 safe release candidate
        uses: actions/checkout@v6
        with:
          ref: feat/v34.152-r13-1-release
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Materialize generated R8 imagery
        shell: bash
        run: |
          set -euo pipefail
          for img in materials-r8 quality-r8; do
            parts=(.sync/r8-modules/${img}.part*)
            test -e "${parts[0]}"
            cat "${parts[@]}" | tr -d '\r\n' | base64 -d > "assets/images/${img}.webp"
            test -s "assets/images/${img}.webp"
            file "assets/images/${img}.webp" | grep -qi 'Web/P'
          done
          echo 'PASS: generated material and quality visuals materialized.'

      - name: Build consolidated R13.1 safe brand stylesheet
        shell: bash
        run: |
          set -euo pipefail
          cat \
            assets/brand-v34.152.css \
            assets/brand-v34.152-r2.css \
            assets/brand-v34.152-r4.css \
            assets/brand-v34.152-r5.css \
            assets/brand-v34.152-r6.css \
            assets/brand-v34.152-r7.css \
            assets/brand-v34.152-r8.css \
            assets/brand-v34.152-r9-tail.css \
            assets/brand-v34.152-r10-tail.css \
            assets/brand-v34.152-r11-tail.css \
            assets/brand-v34.152-r12-tail.css \
            assets/brand-v34.152-r12-fix2.css \
            assets/brand-v34.152-r13-1-tail.css \
            > assets/brand-v34.152-r13-1.css
          test -s assets/brand-v34.152-r13-1.css
          grep -q 'R12 image-led editorial system' assets/brand-v34.152-r13-1.css
          grep -q 'R12.2 live-render guard' assets/brand-v34.152-r13-1.css
          grep -q 'V34.152 R13.1 SAFE' assets/brand-v34.152-r13-1.css
          echo 'PASS: consolidated R13.1 safe brand stylesheet built.'

      - name: Validate source asset library
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/tongjun-logo.svg
          grep -q 'Tongjun portrait mark' assets/tongjun-logo.svg
          for img in \
            about-engineering heavy-plate invar-lng invar-tooling logistics-stock nickel-alloys \
            precision-strip quality-inspection resources-metal standards-rfq titanium-zirconium traceability-pmi \
            materials-overview-gen materials-warehouse-v2 quality-lab-v2 engineering-review-v2 engineering-discussion-v2 \
            materials-r8 quality-r8; do
            p="assets/images/$img.webp"
            test -s "$p"
            file "$p" | grep -qi 'Web/P'
          done
          grep -q "cap.href='/quality'" assets/brand-v34.152.js
          grep -q "res.href='/technical-data'" assets/brand-v34.152.js
          ! grep -q 'images.unsplash.com' assets/brand-v34.152.js
          echo 'PASS: SVG brand mark and R12 industrial imagery validated.'

      - name: Apply unified Tongjun brand shell
        run: python3 scripts/apply-brand-shell-v34-152.py

      - name: Apply R12.2 live fallback baseline
        run: python3 scripts/apply-home-visual-fix-r12.py

      - name: Apply R13.1 safe brand overlay
        run: python3 scripts/apply-r13-1-release.py

      - name: Build Pages mirror with syntax-safe base path rewriting
        shell: bash
        env:
          BASE_PATH: /tongjun-overseas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,shutil

          root=Path('.')
          out=Path('_site')
          base=os.environ.get('BASE_PATH','/tongjun-overseas').rstrip('/')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()

          skip={'.git','.github','.sync','node_modules','scripts','tests','api','_site'}
          text_ext={'.html','.css','.js','.json','.xml','.txt','.webmanifest','.svg'}
          keep_ext=text_ext|{'.ico','.png','.jpg','.jpeg','.webp','.avif','.woff','.woff2','.ttf'}

          attr_root=re.compile(r'(\b(?:href|src|action|poster|content|data-src|data-href)=['"'"']["'"'])/(?!/)', re.I)
          quoted_root=re.compile(r'(["'"'])/(?=[A-Za-z0-9])')
          css_root=re.compile(r'url\((["'"']?)/(?!/)')

          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              rel=p.relative_to(root)
              if rel.parts and rel.parts[0] in skip:
                  continue
              if p.suffix.lower() not in keep_ext and p.name not in {'robots.txt','sitemap.xml','manifest.webmanifest'}:
                  continue

              d=out/rel
              d.parent.mkdir(parents=True,exist_ok=True)
              suffix=p.suffix.lower()

              if suffix in text_ext:
                  try:
                      t=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      shutil.copy2(p,d)
                      continue

                  if suffix in {'.html','.xml','.svg'}:
                      # Rewrite only URL-bearing attributes. Never touch a closing quote followed by '/>'.
                      t=attr_root.sub(lambda m:m.group(1)+base+'/',t)
                      t=css_root.sub(lambda m:'url('+m.group(1)+base+'/',t)
                  elif suffix == '.css':
                      t=css_root.sub(lambda m:'url('+m.group(1)+base+'/',t)
                  elif suffix in {'.js','.json','.webmanifest'}:
                      # In JS/JSON a quote immediately followed by /path starts a root-relative string.
                      t=quoted_root.sub(lambda m:m.group(1)+base+'/',t)

                  d.write_text(t,encoding='utf-8')
              else:
                  shutil.copy2(p,d)

          (out/'.nojekyll').write_text('',encoding='utf-8')
          PY

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          core_pages=(
            index.html materials.html product-forms.html technical-data.html quality.html about.html rfq.html resources.html
            nickel-alloys.html invar-36.html precision-strip.html heavy-plate.html titanium-zirconium.html industries.html
            nickel-process-equipment.html titanium-heat-exchangers.html heavy-plate-pressure-equipment.html
            precision-strip-bellows.html invar-lng.html invar-aerospace-tooling.html
          )
          for f in "${core_pages[@]}"; do
            test -s "_site/$f"
            grep -q 'brand-v34.152-r13-1.css?v=20260916-r13-1-safe' "_site/$f"
            grep -q 'brand-v34.152.js?v=20260915-r12' "_site/$f"
            grep -q 'data-page=' "_site/$f"
            grep -q 'tj-brand-composite' "_site/$f"
            grep -q 'tongjun-logo.svg?v=20260916-r13-1-safe' "_site/$f"
            ! grep -q 'tj-logo-r13' "_site/$f"
            ! grep -q 'tj-wordmark' "_site/$f"
            ! grep -qi 'SINCE 2010' "_site/$f"
            ! grep -q 'TONGJUN SPECIAL METALS' "_site/$f"
          done

          test -s _site/assets/brand-v34.152-r13-1.css
          grep -q 'V34.152 R13.1 SAFE' _site/assets/brand-v34.152-r13-1.css
          test -s _site/assets/tongjun-logo.svg
          grep -q 'Tongjun portrait mark' _site/assets/tongjun-logo.svg

          for img in materials-r8 quality-r8 nickel-alloys precision-strip invar-tooling invar-lng heavy-plate titanium-zirconium logistics-stock resources-metal standards-rfq engineering-review-v2 engineering-discussion-v2; do
            test -s "_site/assets/images/$img.webp"
            file "_site/assets/images/$img.webp" | grep -qi 'Web/P'
          done

          grep -q 'logistics-stock.webp?v=20260915-r12fix2' _site/index.html
          ! grep -q 'hero-special-metals.webp' _site/index.html
          grep -q 'logistics-stock.webp?v=20260915-r12' _site/resource-qualify-china-special-metals.html
          ! grep -q 'supply-route.webp' _site/resource-qualify-china-special-metals.html
          ! grep -Eq 'logo-r13\.avif|hero-port-r13\.avif' _site/index.html
          grep -q 'href="/tongjun-overseas/quality">Quality</a>' _site/index.html
          grep -q 'href="/tongjun-overseas/technical-data">Technical Data</a>' _site/index.html

          grep -q 'materials-r8.webp?v=20260915-r12' _site/materials.html
          grep -q 'quality-r8.webp?v=20260915-r12' _site/quality.html
          grep -q 'quality-r8.webp?v=20260915-r12' _site/technical-data.html
          grep -q 'engineering-discussion-v2.webp?v=20260915-r12' _site/about.html
          grep -q 'engineering-review-v2.webp?v=20260915-r12' _site/rfq.html

          ! grep -R -E 'quality-lab-r13|engineering-team-r13|technical-lab-r13' _site/*.html
          ! grep -R -E 'logo-r13\.avif|hero-port-r13\.avif' _site/*.html
          ! grep -R -E '["'"']/tongjun-overseas/\s*/?>' _site/*.html
          grep -q 'technical_review_plan' _site/rfq.html
          grep -q 'release_checklist' _site/rfq.html
          ! grep -q '同钧' _site/index.html
          ! grep -q 'images.unsplash.com' _site/assets/brand-v34.152.js

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          root=Path('_site')
          base='/tongjun-overseas/'
          broken=[]

          class AssetParser(HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page=page
              def handle_starttag(self, tag, attrs):
                  for key,val in attrs:
                      if key not in {'src','href','poster','data-src'} or not val:
                          continue
                      path=urlsplit(val).path
                      if not path.startswith(base+'assets/'):
                          continue
                      rel=path[len(base):]
                      if not (root/rel).is_file():
                          broken.append((self.page,val))
              handle_startendtag=handle_starttag

          for page in sorted(root.glob('*.html')):
              text=page.read_text(encoding='utf-8')
              if '"/tongjun-overseas/>' in text or "'/tongjun-overseas/>" in text:
                  raise SystemExit(f'ERROR: malformed BASE_PATH rewrite in {page.name}')
              parser=AssetParser(page.name)
              parser.feed(text)

          if broken:
              for page,val in broken:
                  print(f'BROKEN ASSET: {page}: {val}')
              raise SystemExit(f'ERROR: {len(broken)} broken local asset reference(s)')
          print('PASS: no malformed self-closing tags or broken local asset references.')
          PY

          echo 'PASS: V34.152 R13.1 safe release validated end to end.'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
