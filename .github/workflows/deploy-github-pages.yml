name: Deploy temporary GitHub Pages mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-github-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual-recovery staging
        uses: actions/checkout@v6
        with:
          ref: v34.152-pages-visual-rebuild
          fetch-depth: 1

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build GitHub Pages mirror
        shell: bash
        env:
          BASE_PATH: /tongjun-overseas
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          import os,re,shutil
          from PIL import Image,ImageDraw
          root=Path('.'); out=Path('_site'); base=os.environ.get('BASE_PATH','/tongjun-overseas').rstrip('/')
          if out.exists(): shutil.rmtree(out)
          out.mkdir()
          skip={'.git','.github','.sync','node_modules','scripts','tests','api','_site'}
          text_ext={'.html','.css','.js','.json','.xml','.txt','.webmanifest','.svg'}
          keep_ext=text_ext|{'.ico','.png','.jpg','.jpeg','.webp','.woff','.woff2','.ttf'}
          for p in root.rglob('*'):
            if not p.is_file(): continue
            rel=p.relative_to(root)
            if rel.parts and rel.parts[0] in skip: continue
            if p.suffix.lower() not in keep_ext and p.name not in {'robots.txt','sitemap.xml','manifest.webmanifest'}: continue
            d=out/rel; d.parent.mkdir(parents=True,exist_ok=True)
            if p.suffix.lower() in text_ext:
              try: t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: shutil.copy2(p,d); continue
              t=re.sub(r'(["\'])/(?!/)',lambda m:m.group(1)+base+'/',t)
              t=re.sub(r'url\((/)(?!/)',lambda m:'url('+base+'/',t)
              d.write_text(t,encoding='utf-8')
            else: shutil.copy2(p,d)
          refs=set()
          for p in out.rglob('*'):
            if p.suffix.lower() not in {'.html','.css','.js','.json','.webmanifest'}: continue
            try:t=p.read_text(encoding='utf-8')
            except:continue
            refs.update(re.findall(r'(?:'+re.escape(base)+r')?/assets/images/([A-Za-z0-9._-]+\.webp)',t))
          imgdir=out/'assets'/'images'; imgdir.mkdir(parents=True,exist_ok=True)
          for name in refs:
            target=imgdir/name
            if target.exists(): continue
            im=Image.new('RGB',(800,500),(20,34,45)); d=ImageDraw.Draw(im)
            d.rectangle((0,350,800,500),fill=(9,20,28))
            for x in range(-100,900,85): d.line((x,0,x-130,500),fill=(49,67,79),width=2)
            im.save(target,'WEBP',quality=72,method=4)
          (out/'.nojekyll').write_text('',encoding='utf-8')
          print(f'Pages mirror built with {len(refs)} fallback references covered.')
          PY

      - name: Sanity-check Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/assets/site.css
          test -f _site/assets/site.js
          grep -q 'From Material' _site/index.html
          grep -q 'TONGJUN' _site/index.html
          grep -q 'Request a Quote' _site/index.html
          grep -q '/tongjun-overseas/rfq' _site/index.html
          echo 'PASS: visual-recovery homepage and Pages paths validated.'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
