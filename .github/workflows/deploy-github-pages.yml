name: Deploy temporary GitHub Pages mirror
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-github-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V34.152 brand migration
        uses: actions/checkout@v6
        with:
          ref: v34.152-brand-migration
          fetch-depth: 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Apply unified brand shell
        run: python3 scripts/apply-brand-shell-v34-152.py
      - name: Build Pages mirror
        run: |
          mkdir -p _site
          cp -a *.html assets _site/
          test -d resources && cp -a resources _site/ || true
          test -f manifest.webmanifest && cp manifest.webmanifest _site/ || true
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          base='/tongjun-overseas'
          for p in Path('_site').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              for a in ['href','src','action']:
                  s=s.replace(f'{a}="/',f'{a}="{base}/')
              s=s.replace(f'{base}//',f'{base}/')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate brand consistency
        run: |
          test -f _site/index.html
          test -f _site/assets/brand-v34.152.css
          test -f _site/assets/brand-v34.152.js
          test -f _site/assets/tongjun-logo.svg
          grep -q 'brand-v34.152.css' _site/materials.html
          grep -q 'brand-v34.152.css' _site/technical-data.html
          grep -q 'brand-v34.152.css' _site/quality.html
          grep -q 'brand-v34.152.css' _site/about.html
          grep -q 'brand-v34.152.css' _site/rfq.html
          grep -q 'RFQ' _site/rfq.html
          echo 'PASS: shared Tongjun Metal Tech shell applied to core pages.'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
