name: Deploy temporary GitHub Pages mirror
# refresh: R12.2 live-render guard for text wordmark + validated logistics hero

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-github-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V34.152 brand migration
        uses: actions/checkout@v6
        with:
          ref: v34.152-brand-migration
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Materialize generated R8 imagery
        shell: bash
        run: |
          set -euo pipefail
          for img in materials-r8 quality-r8; do
            parts=(.sync/r8-modules/${img}.part*)
            test -e "${parts[0]}"
            cat "${parts[@]}" | tr -d '\r\n' | base64 -d > "assets/images/${img}.webp"
            test -s "assets/images/${img}.webp"
            file "assets/images/${img}.webp" | grep -qi 'Web/P'
          done
          echo 'PASS: generated material and quality visuals materialized.'

      - name: Build consolidated R12 brand stylesheet
        shell: bash
        run: |
          set -euo pipefail
          cat \
            assets/brand-v34.152.css \
            assets/brand-v34.152-r2.css \
            assets/brand-v34.152-r4.css \
            assets/brand-v34.152-r5.css \
            assets/brand-v34.152-r6.css \
            assets/brand-v34.152-r7.css \
            assets/brand-v34.152-r8.css \
            assets/brand-v34.152-r9-tail.css \
            assets/brand-v34.152-r10-tail.css \
            assets/brand-v34.152-r11-tail.css \
            assets/brand-v34.152-r12-tail.css \
            assets/brand-v34.152-r12-fix2.css \
            > assets/brand-v34.152-r12.css
          test -s assets/brand-v34.152-r12.css
          grep -q 'R12 image-led editorial system' assets/brand-v34.152-r12.css
          grep -q 'R12.2 live-render guard' assets/brand-v34.152-r12.css
          grep -q 'tj-wordmark' assets/brand-v34.152-r12.css
          echo 'PASS: consolidated R12.2 brand stylesheet built.'

      - name: Validate source image library
        shell: bash
        run: |
          set -euo pipefail
          for img in \
            about-engineering heavy-plate invar-lng invar-tooling logistics-stock nickel-alloys \
            precision-strip quality-inspection resources-metal standards-rfq titanium-zirconium traceability-pmi \
            materials-overview-gen materials-warehouse-v2 quality-lab-v2 engineering-review-v2 engineering-discussion-v2 \
            materials-r8 quality-r8; do
            p="assets/images/$img.webp"
            test -s "$p"
            file "$p" | grep -qi 'Web/P'
          done
          file assets/images/logistics-stock.webp | grep -qi 'Web/P'
          test -s assets/brand-v34.152-r12.css
          grep -q "cap.href='/quality'" assets/brand-v34.152.js
          grep -q "res.href='/technical-data'" assets/brand-v34.152.js
          ! grep -q 'images.unsplash.com' assets/brand-v34.152.js
          echo 'PASS: R12.2 local-only industrial image library validated.'

      - name: Apply unified Tongjun brand shell
        run: python3 scripts/apply-brand-shell-v34-152.py

      - name: Apply R12.2 live render guard
        run: python3 scripts/apply-home-visual-fix-r12.py

      - name: Build Pages mirror
        shell: bash
        env:
          BASE_PATH: /tongjun-overseas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,shutil
          root=Path('.'); out=Path('_site'); base=os.environ.get('BASE_PATH','/tongjun-overseas').rstrip('/')
          if out.exists(): shutil.rmtree(out)
          out.mkdir()
          skip={'.git','.github','.sync','node_modules','scripts','tests','api','_site'}
          text_ext={'.html','.css','.js','.json','.xml','.txt','.webmanifest','.svg'}
          keep_ext=text_ext|{'.ico','.png','.jpg','.jpeg','.webp','.woff','.woff2','.ttf'}
          for p in root.rglob('*'):
            if not p.is_file(): continue
            rel=p.relative_to(root)
            if rel.parts and rel.parts[0] in skip: continue
            if p.suffix.lower() not in keep_ext and p.name not in {'robots.txt','sitemap.xml','manifest.webmanifest'}: continue
            d=out/rel; d.parent.mkdir(parents=True,exist_ok=True)
            if p.suffix.lower() in text_ext:
              try: t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: shutil.copy2(p,d); continue
              t=re.sub(r'(["\'])/(?!/)',lambda m:m.group(1)+base+'/',t)
              t=re.sub(r'url\((/)(?!/)',lambda m:'url('+base+'/',t)
              d.write_text(t,encoding='utf-8')
            else:
              shutil.copy2(p,d)
          (out/'.nojekyll').write_text('',encoding='utf-8')
          PY

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          core_pages=(
            index.html materials.html product-forms.html technical-data.html quality.html about.html rfq.html resources.html
            nickel-alloys.html invar-36.html precision-strip.html heavy-plate.html titanium-zirconium.html industries.html
            nickel-process-equipment.html titanium-heat-exchangers.html heavy-plate-pressure-equipment.html
            precision-strip-bellows.html invar-lng.html invar-aerospace-tooling.html
          )
          for f in "${core_pages[@]}"; do
            test -s "_site/$f"
            grep -q 'brand-v34.152-r12.css?v=20260915-r12' "_site/$f"
            grep -q 'brand-v34.152.js?v=20260915-r12' "_site/$f"
            grep -q 'data-page=' "_site/$f"
            grep -q 'tj-wordmark' "_site/$f"
            grep -q 'METAL TECH · EST. 2026' "_site/$f"
            ! grep -q 'tj-logo-img' "_site/$f"
            ! grep -q 'TONGJUN SPECIAL METALS' "_site/$f"
          done

          test -s _site/assets/brand-v34.152-r12.css
          grep -q 'R12.2 live-render guard' _site/assets/brand-v34.152-r12.css
          grep -q 'tj-wordmark' _site/assets/brand-v34.152-r12.css

          for img in materials-r8 quality-r8 nickel-alloys precision-strip invar-tooling invar-lng heavy-plate titanium-zirconium logistics-stock resources-metal standards-rfq engineering-review-v2 engineering-discussion-v2; do
            test -s "_site/assets/images/$img.webp"
            file "_site/assets/images/$img.webp" | grep -qi 'Web/P'
          done

          grep -q 'logistics-stock.webp?v=20260915-r12fix2' _site/index.html
          ! grep -q 'hero-port-v2.webp?v=20260915-r12fix1' _site/index.html
          ! grep -q 'hero-port-r7.svg' _site/index.html
          grep -q 'href="/tongjun-overseas/quality">Quality</a>' _site/index.html
          grep -q 'href="/tongjun-overseas/technical-data">Technical Data</a>' _site/index.html

          grep -q 'materials-r8.webp?v=20260915-r12' _site/materials.html
          grep -q 'materials-r8.webp?v=20260915-r12' _site/product-forms.html
          grep -q 'quality-r8.webp?v=20260915-r12' _site/quality.html
          grep -q 'quality-r8.webp?v=20260915-r12' _site/technical-data.html
          grep -q 'engineering-discussion-v2.webp?v=20260915-r12' _site/about.html
          grep -q 'engineering-review-v2.webp?v=20260915-r12' _site/rfq.html

          grep -q 'nickel-alloys.webp?v=20260915-r12' _site/nickel-alloys.html
          grep -q 'nickel-alloys.webp?v=20260915-r12' _site/nickel-process-equipment.html
          grep -q 'precision-strip.webp?v=20260915-r12' _site/precision-strip.html
          grep -q 'precision-strip.webp?v=20260915-r12' _site/precision-strip-bellows.html
          grep -q 'invar-tooling.webp?v=20260915-r12' _site/invar-36.html
          grep -q 'invar-tooling.webp?v=20260915-r12' _site/invar-aerospace-tooling.html
          grep -q 'invar-lng.webp?v=20260915-r12' _site/invar-lng.html
          grep -q 'heavy-plate.webp?v=20260915-r12' _site/heavy-plate.html
          grep -q 'heavy-plate.webp?v=20260915-r12' _site/heavy-plate-pressure-equipment.html
          grep -q 'titanium-zirconium.webp?v=20260915-r12' _site/titanium-zirconium.html
          grep -q 'titanium-zirconium.webp?v=20260915-r12' _site/titanium-heat-exchangers.html
          grep -q 'logistics-stock.webp?v=20260915-r12' _site/industries.html
          grep -q 'resources-metal.webp?v=20260915-r12' _site/resources.html

          grep -q 'technical_review_plan' _site/rfq.html
          grep -q 'release_checklist' _site/rfq.html
          ! grep -q '同钧' _site/index.html
          ! grep -q 'images.unsplash.com' _site/assets/brand-v34.152.js
          echo 'PASS: R12.2 live brand fallback, visible hero path, image ownership and RFQ workflow validated.'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
