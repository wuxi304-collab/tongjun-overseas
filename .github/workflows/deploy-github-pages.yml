name: Deploy temporary GitHub Pages mirror
# V34.152 R14 — conversion-first mobile hierarchy + full internal route/deep-link validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-github-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V34.152 R14 release candidate
        uses: actions/checkout@v6
        with:
          ref: feat/v34.152-r14-conversion
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Materialize generated R8 imagery
        shell: bash
        run: |
          set -euo pipefail
          for img in materials-r8 quality-r8; do
            parts=(.sync/r8-modules/${img}.part*)
            test -e "${parts[0]}"
            cat "${parts[@]}" | tr -d '\r\n' | base64 -d > "assets/images/${img}.webp"
            test -s "assets/images/${img}.webp"
            file "assets/images/${img}.webp" | grep -qi 'Web/P'
          done

      - name: Build consolidated R14 stylesheet
        shell: bash
        run: |
          set -euo pipefail
          cat \
            assets/brand-v34.152.css \
            assets/brand-v34.152-r2.css \
            assets/brand-v34.152-r4.css \
            assets/brand-v34.152-r5.css \
            assets/brand-v34.152-r6.css \
            assets/brand-v34.152-r7.css \
            assets/brand-v34.152-r8.css \
            assets/brand-v34.152-r9-tail.css \
            assets/brand-v34.152-r10-tail.css \
            assets/brand-v34.152-r11-tail.css \
            assets/brand-v34.152-r12-tail.css \
            assets/brand-v34.152-r12-fix2.css \
            assets/brand-v34.152-r13-1-tail.css \
            assets/brand-v34.152-r14-tail.css \
            > assets/brand-v34.152-r14.css
          test -s assets/brand-v34.152-r14.css
          grep -q 'V34.152 R14' assets/brand-v34.152-r14.css
          grep -q 'data-page="technical-data".*visual-band{display:none' assets/brand-v34.152-r14.css
          grep -q 'data-page="rfq".*#rfqForm{order:1' assets/brand-v34.152-r14.css
          grep -q '#energy' assets/brand-v34.152-r14.css
          grep -q '#marine' assets/brand-v34.152-r14.css

      - name: Validate trusted source assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/tongjun-logo.svg
          grep -q 'Tongjun portrait mark' assets/tongjun-logo.svg
          for img in materials-r8 quality-r8 logistics-stock nickel-alloys precision-strip invar-tooling invar-lng heavy-plate titanium-zirconium resources-metal standards-rfq engineering-review-v2 engineering-discussion-v2; do
            test -s "assets/images/$img.webp"
            file "assets/images/$img.webp" | grep -qi 'Web/P'
          done
          if grep -q 'images.unsplash.com' assets/brand-v34.152.js; then
            echo 'ERROR: external Unsplash dependency returned.'
            exit 1
          fi

      - name: Apply V34.152 release overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-brand-shell-v34-152.py
          python3 scripts/apply-home-visual-fix-r12.py
          python3 scripts/apply-r13-1-release.py
          python3 scripts/apply-r14-conversion.py

      - name: Build Pages mirror with syntax-safe base path rewriting
        shell: bash
        env:
          BASE_PATH: /tongjun-overseas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,shutil

          root=Path('.')
          out=Path('_site')
          base=os.environ.get('BASE_PATH','/tongjun-overseas').rstrip('/')
          if out.exists(): shutil.rmtree(out)
          out.mkdir()

          skip={'.git','.github','.sync','node_modules','scripts','tests','api','_site'}
          text_ext={'.html','.css','.js','.json','.xml','.txt','.webmanifest','.svg'}
          keep_ext=text_ext|{'.ico','.png','.jpg','.jpeg','.webp','.avif','.woff','.woff2','.ttf'}
          attr_root=re.compile(r"(\b(?:href|src|action|poster|content|data-src|data-href)=[\"'])/(?!/)", re.I)
          quoted_root=re.compile(r"([\"'])/(?=[A-Za-z0-9])")
          css_root=re.compile(r"url\(([\"']?)/(?!/)")

          for p in root.rglob('*'):
              if not p.is_file(): continue
              rel=p.relative_to(root)
              if rel.parts and rel.parts[0] in skip: continue
              if p.suffix.lower() not in keep_ext and p.name not in {'robots.txt','sitemap.xml','manifest.webmanifest'}: continue
              d=out/rel; d.parent.mkdir(parents=True,exist_ok=True)
              suffix=p.suffix.lower()
              if suffix in text_ext:
                  try: t=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      shutil.copy2(p,d); continue
                  if suffix in {'.html','.xml','.svg'}:
                      t=attr_root.sub(lambda m:m.group(1)+base+'/',t)
                      t=css_root.sub(lambda m:'url('+m.group(1)+base+'/',t)
                  elif suffix == '.css':
                      t=css_root.sub(lambda m:'url('+m.group(1)+base+'/',t)
                  elif suffix in {'.js','.json','.webmanifest'}:
                      t=quoted_root.sub(lambda m:m.group(1)+base+'/',t)
                  d.write_text(t,encoding='utf-8')
              else:
                  shutil.copy2(p,d)
          (out/'.nojekyll').write_text('',encoding='utf-8')
          PY

      - name: Validate R14 Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          root=Path('_site')
          base='/tongjun-overseas/'
          htmls=sorted(root.glob('*.html'))
          if len(htmls) != 50:
              raise SystemExit(f'ERROR: expected 50 HTML pages, found {len(htmls)}')

          core=['index.html','technical-data.html','quality.html','rfq.html','materials.html','product-forms.html','about.html','resources.html','industries.html']
          for name in core:
              text=(root/name).read_text(encoding='utf-8')
              if 'brand-v34.152-r14.css?v=20260916-r14' not in text:
                  raise SystemExit(f'ERROR: R14 stylesheet missing in {name}')

          tech=(root/'technical-data.html').read_text(encoding='utf-8')
          quality=(root/'quality.html').read_text(encoding='utf-8')
          rfq=(root/'rfq.html').read_text(encoding='utf-8')
          industries=(root/'industries.html').read_text(encoding='utf-8')
          if 'Technical data for sourcing decisions.' not in tech:
              raise SystemExit('ERROR: Technical Data headline regressed')
          for name,text in [('technical-data.html',tech),('quality.html',quality),('rfq.html',rfq)]:
              if text.count('class="r14-action-rail"') != 1:
                  raise SystemExit(f'ERROR: R14 action rail count wrong in {name}')
          if 'href="#rfqForm"' not in rfq:
              raise SystemExit('ERROR: RFQ direct form jump missing')
          for anchor in ('id="energy"','id="marine"'):
              if anchor not in industries:
                  raise SystemExit(f'ERROR: Industries deep-link destination missing: {anchor}')

          css=(root/'assets/brand-v34.152-r14.css').read_text(encoding='utf-8')
          required=[
              'V34.152 R14',
              'body.brand-v34[data-page="technical-data"] .visual-band{display:none!important}',
              'body.brand-v34[data-page="rfq"] .visual-band{display:none!important}',
              'body.brand-v34[data-page="rfq"] #rfqForm{order:1!important',
              'body.brand-v34[data-page="home"] .hero-positioning{display:none!important}',
              'body.brand-v34 #energy',
              'body.brand-v34 #marine',
          ]
          for marker in required:
              if marker not in css:
                  raise SystemExit(f'ERROR: missing R14 CSS gate: {marker}')

          forbidden=(
              'SINCE 2010','TONGJUN SPECIAL METALS','hero-special-metals.webp','supply-route.webp',
              'quality-lab-r13','engineering-team-r13','technical-lab-r13','logo-r13.avif','hero-port-r13.avif',
              'tj-logo-r13','tj-wordmark',
          )

          class PageParser(HTMLParser):
              def __init__(self,page):
                  super().__init__(); self.page=page; self.ids=set(); self.links=[]; self.assets=[]
              def handle_starttag(self,tag,attrs): self._read(tag,attrs)
              def handle_startendtag(self,tag,attrs): self._read(tag,attrs)
              def _read(self,tag,attrs):
                  data=dict(attrs)
                  if data.get('id'): self.ids.add(data['id'])
                  href=data.get('href')
                  # Only <a href> participates in navigation/deep-link validation.
                  if tag == 'a' and href:
                      if urlsplit(href).path.startswith(base+'assets/'):
                          self.assets.append(href)
                      else:
                          self.links.append(href)
                  for key in ('src','poster','data-src'):
                      if data.get(key): self.assets.append(data[key])
                  # <link> href values are resources, never page routes.
                  if tag == 'link' and href: self.assets.append(href)

          parsed={}
          stem_to_name={p.stem:p.name for p in htmls}
          stem_to_name['index']='index.html'
          for page in htmls:
              text=page.read_text(encoding='utf-8')
              if '"/tongjun-overseas/>' in text or "'/tongjun-overseas/>" in text:
                  raise SystemExit(f'ERROR: malformed BASE_PATH rewrite in {page.name}')
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f'ERROR: forbidden marker {marker!r} in {page.name}')
              parser=PageParser(page.name); parser.feed(text); parsed[page.name]=parser

          broken_assets=[]; broken_routes=[]; broken_anchors=[]
          for page in htmls:
              parser=parsed[page.name]
              for val in parser.assets:
                  path=urlsplit(val).path
                  if not path.startswith(base+'assets/'): continue
                  rel=path[len(base):]
                  if not (root/rel).is_file(): broken_assets.append((page.name,val))

              for href in parser.links:
                  if href.startswith(('mailto:','tel:','javascript:','http://','https://')): continue
                  u=urlsplit(href); path=u.path
                  if path == '':
                      target_name=page.name
                  else:
                      if path.startswith(base): path=path[len(base)-1:]
                      if path in ('','/'):
                          target_name='index.html'
                      else:
                          target=path.strip('/').split('/')[-1]
                          if target.endswith('.html'): target=target[:-5]
                          target_name=stem_to_name.get(target)
                          if not target_name:
                              broken_routes.append((page.name,href)); continue
                  if u.fragment and u.fragment not in parsed[target_name].ids:
                      broken_anchors.append((page.name,href,target_name,u.fragment))

          if broken_assets:
              for x in broken_assets: print('BROKEN ASSET:',x)
              raise SystemExit(f'ERROR: {len(broken_assets)} broken local asset reference(s)')
          if broken_routes:
              for x in broken_routes[:30]: print('BROKEN ROUTE:',x)
              raise SystemExit(f'ERROR: {len(broken_routes)} broken internal route(s)')
          if broken_anchors:
              for x in broken_anchors[:30]: print('BROKEN ANCHOR:',x)
              raise SystemExit(f'ERROR: {len(broken_anchors)} broken internal deep-link anchor(s)')

          print('PASS: R14 50-page gate, conversion hierarchy, local assets, internal routes and deep-link anchors validated.')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
