name: Deploy temporary GitHub Pages mirror
# refresh: R8.1 materialized module imagery + English-only brand + corrected navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-github-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V34.152 brand migration
        uses: actions/checkout@v6
        with:
          ref: v34.152-brand-migration
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Materialize R8 module imagery
        shell: bash
        run: |
          set -euo pipefail
          for img in materials-r8 quality-r8; do
            parts=(.sync/r8-modules/${img}.part*)
            test -e "${parts[0]}"
            cat "${parts[@]}" | tr -d '\r\n' | base64 -d > "assets/images/${img}.webp"
            test -s "assets/images/${img}.webp"
            file "assets/images/${img}.webp" | grep -qi 'Web/P'
          done
          echo 'PASS: R8 material and quality visuals materialized.'

      - name: Validate source visual system
        shell: bash
        run: |
          set -euo pipefail
          for img in about-engineering heavy-plate invar-lng invar-tooling logistics-stock nickel-alloys og-cover precision-strip quality-inspection resources-metal standards-rfq titanium-zirconium traceability-pmi columbus-mark materials-overview-gen columbus-logo-v2 hero-port-v2 materials-warehouse-v2 quality-lab-v2 engineering-review-v2 engineering-discussion-v2 materials-r8 quality-r8; do
            p="assets/images/$img.webp"
            test -s "$p"
            file "$p" | grep -qi 'Web/P'
          done
          for svg in columbus-logo-r7 hero-port-r7; do
            test -s "assets/images/$svg.svg"
            grep -q '<svg' "assets/images/$svg.svg"
          done
          test -s assets/brand-v34.152-r7.css
          test -s assets/brand-v34.152-r8.css
          grep -q 'inner-page editorial convergence' assets/brand-v34.152-r8.css
          grep -q "cap.href='/quality'" assets/brand-v34.152.js
          grep -q "res.href='/technical-data'" assets/brand-v34.152.js
          ! grep -q 'images.unsplash.com' assets/brand-v34.152.js
          echo 'PASS: R8 visual layer and local-only image recovery validated.'

      - name: Apply unified Tongjun brand shell
        run: python3 scripts/apply-brand-shell-v34-152.py

      - name: Build Pages mirror
        shell: bash
        env:
          BASE_PATH: /tongjun-overseas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,shutil
          root=Path('.'); out=Path('_site'); base=os.environ.get('BASE_PATH','/tongjun-overseas').rstrip('/')
          if out.exists(): shutil.rmtree(out)
          out.mkdir()
          skip={'.git','.github','.sync','node_modules','scripts','tests','api','_site'}
          text_ext={'.html','.css','.js','.json','.xml','.txt','.webmanifest','.svg'}
          keep_ext=text_ext|{'.ico','.png','.jpg','.jpeg','.webp','.woff','.woff2','.ttf'}
          for p in root.rglob('*'):
            if not p.is_file(): continue
            rel=p.relative_to(root)
            if rel.parts and rel.parts[0] in skip: continue
            if p.suffix.lower() not in keep_ext and p.name not in {'robots.txt','sitemap.xml','manifest.webmanifest'}: continue
            d=out/rel; d.parent.mkdir(parents=True,exist_ok=True)
            if p.suffix.lower() in text_ext:
              try: t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: shutil.copy2(p,d); continue
              t=re.sub(r'(["\'])/(?!/)',lambda m:m.group(1)+base+'/',t)
              t=re.sub(r'url\((/)(?!/)',lambda m:'url('+base+'/',t)
              d.write_text(t,encoding='utf-8')
            else:
              shutil.copy2(p,d)
          (out/'.nojekyll').write_text('',encoding='utf-8')
          PY

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html materials.html product-forms.html technical-data.html quality.html about.html rfq.html resources.html nickel-alloys.html precision-strip.html heavy-plate.html; do
            test -s "_site/$f"
            grep -q 'brand-v34.152.css' "_site/$f"
            grep -q 'brand-v34.152-r2.css' "_site/$f"
            grep -q 'brand-v34.152-r4.css' "_site/$f"
            grep -q 'brand-v34.152-r5.css' "_site/$f"
            grep -q 'brand-v34.152-r6.css' "_site/$f"
            grep -q 'brand-v34.152-r7.css?v=20260914-r7' "_site/$f"
            grep -q 'brand-v34.152-r8.css?v=20260914-r8' "_site/$f"
            grep -q 'brand-v34.152.js' "_site/$f"
            grep -q 'tj-logo-img' "_site/$f"
            grep -q 'columbus-logo-r7.svg?v=20260914-r7' "_site/$f"
            ! grep -q 'TONGJUN SPECIAL METALS' "_site/$f"
          done

          for img in materials-r8 quality-r8; do
            test -s "_site/assets/images/$img.webp"
            file "_site/assets/images/$img.webp" | grep -qi 'Web/P'
          done

          grep -q 'hero-bg-r6' _site/index.html
          grep -q 'hero-port-r7.svg?v=20260914-r7' _site/index.html
          grep -q 'href="/tongjun-overseas/quality">Quality</a>' _site/index.html
          grep -q 'href="/tongjun-overseas/technical-data">Technical Data</a>' _site/index.html
          grep -q 'materials-r8.webp?v=20260914-r8' _site/materials.html
          grep -q 'quality-r8.webp?v=20260914-r8' _site/quality.html
          grep -q 'technical-visual' _site/technical-data.html
          grep -q 'quality-lab-v2.webp' _site/technical-data.html
          grep -q 'engineering-discussion-v2.webp' _site/about.html
          grep -q 'engineering-review-v2.webp' _site/rfq.html
          grep -q 'technical_review_plan' _site/rfq.html
          grep -q 'release_checklist' _site/rfq.html
          ! grep -q '同钧' _site/index.html
          ! grep -q 'images.unsplash.com' _site/assets/brand-v34.152.js
          echo 'PASS: R8.1 module imagery, navigation, English brand and RFQ workflow validated.'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
