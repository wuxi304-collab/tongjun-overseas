name: Deploy temporary GitHub Pages mirror
# V34.152 R15.8 — deterministic visuals + observable static/API release identity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-github-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V34.152 R15.8 release candidate
        uses: actions/checkout@v6
        with:
          ref: feat/v34.152-r15.8-release-observability
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Materialize generated R8 imagery
        shell: bash
        run: |
          set -euo pipefail
          for img in materials-r8 quality-r8; do
            parts=(.sync/r8-modules/${img}.part*)
            test -e "${parts[0]}"
            cat "${parts[@]}" | tr -d '\r\n' | base64 -d > "assets/images/${img}.webp"
            test -s "assets/images/${img}.webp"
            file "assets/images/${img}.webp" | grep -qi 'Web/P'
          done


      - name: Verify frozen R15.7 homepage hero
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize-r15-2k-assets.py

      - name: Verify frozen R15.7 content-addressed WebP assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize-r15-6-native-assets.py


      - name: Build consolidated R15.8 stylesheet
        shell: bash
        run: |
          set -euo pipefail
          cat \
            assets/brand-v34.152.css \
            assets/brand-v34.152-r2.css \
            assets/brand-v34.152-r4.css \
            assets/brand-v34.152-r5.css \
            assets/brand-v34.152-r6.css \
            assets/brand-v34.152-r7.css \
            assets/brand-v34.152-r8.css \
            assets/brand-v34.152-r9-tail.css \
            assets/brand-v34.152-r10-tail.css \
            assets/brand-v34.152-r11-tail.css \
            assets/brand-v34.152-r12-tail.css \
            assets/brand-v34.152-r12-fix2.css \
            assets/brand-v34.152-r13-1-tail.css \
            assets/brand-v34.152-r14-tail.css \
            assets/brand-v34.152-r15-tail.css \
            > assets/brand-v34.152-r14.css
          test -s assets/brand-v34.152-r14.css
          grep -q 'V34.152 R14.1' assets/brand-v34.152-r14.css
          grep -q 'V34.152 R15.4' assets/brand-v34.152-r14.css
          grep -q 'body.brand-v34 .skip-link' assets/brand-v34.152-r14.css
          grep -q ':focus-visible' assets/brand-v34.152-r14.css
          grep -q 'prefers-reduced-motion: reduce' assets/brand-v34.152-r14.css
          grep -q 'data-page="technical-data".*visual-band{display:none' assets/brand-v34.152-r14.css
          grep -q 'data-page="rfq".*#rfqForm{order:1' assets/brand-v34.152-r14.css
          grep -q 'r14-rfq-optional' assets/brand-v34.152-r14.css
          grep -q 'r14-rfq-advanced' assets/brand-v34.152-r14.css
          grep -q '#rfqReadiness' assets/brand-v34.152-r14.css
          grep -q '#energy' assets/brand-v34.152-r14.css
          grep -q '#marine' assets/brand-v34.152-r14.css

      - name: Validate trusted source assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/tongjun-logo.svg
          grep -q 'Tongjun portrait mark' assets/tongjun-logo.svg
          for img in materials-r8 quality-r8 logistics-stock nickel-alloys precision-strip invar-tooling invar-lng heavy-plate titanium-zirconium resources-metal standards-rfq engineering-review-v2 engineering-discussion-v2; do
            test -s "assets/images/$img.webp"
            file "assets/images/$img.webp" | grep -qi 'Web/P'
          done
          if grep -q 'images.unsplash.com' assets/brand-v34.152.js; then
            echo 'ERROR: external Unsplash dependency returned.'
            exit 1
          fi

      - name: Apply V34.152 R15.8 release overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-brand-shell-v34-152.py
          python3 scripts/apply-home-visual-fix-r12.py
          python3 scripts/apply-r13-1-release.py
          python3 scripts/apply-r14-conversion.py
          python3 scripts/apply-r14-runtime.py
          python3 scripts/apply-r15-accessibility.py
          python3 scripts/apply-r15-2k-visual-freeze.py
          python3 scripts/apply-r15-6-native-visuals.py

      - name: Run full V34.152 R15.8 source gate
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          python3 scripts/validate-form-semantics.py .
          python3 scripts/validate-rfq-contract.py .
          python3 scripts/validate-r15-visual-assets.py .
          python3 scripts/validate-r15-6-native-visuals.py .

      - name: Build hardened temporary Pages mirror
        shell: bash
        env:
          BASE_PATH: /tongjun-overseas
        run: |
          set -euo pipefail
          python3 scripts/build-pages-mirror.py

      - name: Validate V34.152 R15.8 Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-form-semantics.py _site
          python3 scripts/validate-rfq-contract.py _site
          python3 scripts/validate-r15-visual-assets.py _site
          python3 scripts/validate-r15-6-native-visuals.py _site
          python3 scripts/validate-pages-release.py _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1


  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V34.152 R15.8 production candidate
        uses: actions/checkout@v6
        with:
          ref: feat/v34.152-r15.8-release-observability
          fetch-depth: 1

      - name: Run production build contract
        shell: bash
        run: |
          set -euo pipefail
          npm run build:production
          test -s _prod/index.html
          test -s _prod/assets/images/logistics-stock.webp
          test -s _prod/assets/images/r15-6-titanium.webp
          test -s _prod/.well-known/release.json
          python3 -c 'import json; p=json.load(open("_prod/.well-known/release.json")); assert p["site_release"]=="V34.152 R15.8"; assert p["environment"]=="production"; assert len(p["source_commit"])==40'
          test ! -e _prod/VISUAL_MANIFEST_R15_7.json
          test ! -e _prod/scripts
          test ! -e _prod/.sync
          echo "PASS: R15.8 production build completed from frozen repository assets with observable identity."

  deploy:
    needs: [build, production-build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
