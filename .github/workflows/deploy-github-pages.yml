name: Deploy temporary GitHub Pages mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-github-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual-recovery staging
        uses: actions/checkout@v6
        with:
          ref: v34.152-pages-visual-rebuild
          fetch-depth: 1

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build GitHub Pages mirror
        shell: bash
        env:
          BASE_PATH: /tongjun-overseas
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          import os, re, shutil, random
          from PIL import Image, ImageDraw, ImageFilter

          root=Path('.')
          out=Path('_site')
          base=os.environ.get('BASE_PATH','/tongjun-overseas').rstrip('/')
          if out.exists(): shutil.rmtree(out)
          out.mkdir()

          skip_top={'.git','.github','.sync','node_modules','scripts','tests','api','_site'}
          keep_ext={'.html','.css','.js','.json','.xml','.txt','.svg','.webmanifest','.ico','.png','.jpg','.jpeg','.webp','.woff','.woff2','.ttf'}
          keep_names={'robots.txt','sitemap.xml','manifest.webmanifest'}

          for p in root.rglob('*'):
            if not p.is_file(): continue
            rel=p.relative_to(root)
            if rel.parts and rel.parts[0] in skip_top: continue
            if p.suffix.lower() not in keep_ext and p.name not in keep_names: continue
            dest=out/rel
            dest.parent.mkdir(parents=True,exist_ok=True)
            if p.suffix.lower() in {'.html','.css','.js','.json','.xml','.txt','.webmanifest','.svg'}:
              try: text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                shutil.copy2(p,dest); continue
              text=re.sub(r'(["\'])/(?!/)', lambda m: m.group(1)+base+'/', text)
              text=re.sub(r'url\((/)(?!/)', lambda m: 'url('+base+'/', text)
              dest.write_text(text,encoding='utf-8')
            else:
              shutil.copy2(p,dest)

          refs=set()
          for p in out.rglob('*'):
            if p.suffix.lower() not in {'.html','.css','.js','.json','.webmanifest'}: continue
            try: text=p.read_text(encoding='utf-8')
            except Exception: continue
            for m in re.finditer(r'(?:'+re.escape(base)+r')?/assets/images/([A-Za-z0-9._-]+\.webp)',text):
              refs.add(m.group(1))

          imgdir=out/'assets'/'images'; imgdir.mkdir(parents=True,exist_ok=True)
          for name in sorted(refs):
            target=imgdir/name
            if target.exists(): continue
            seed=sum(map(ord,name)); rng=random.Random(seed)
            w,h=(1600,1000); im=Image.new('RGB',(w,h),(18,31,40)); px=im.load()
            for y in range(h):
              t=y/(h-1); basec=(20+int(20*t),34+int(27*t),43+int(31*t))
              for x in range(w):
                n=rng.randrange(-7,8); px[x,y]=tuple(max(0,min(255,c+n)) for c in basec)
            im=im.filter(ImageFilter.GaussianBlur(0.45)); d=ImageDraw.Draw(im,'RGBA')
            for i in range(18):
              x=int((i/17)*w)+rng.randint(-35,35); d.line((x,0,x-230,h),fill=(205,220,228,22),width=rng.randint(1,4))
            d.rectangle((0,int(h*.76),w,h),fill=(7,18,25,105)); im.save(target,'WEBP',quality=84,method=6)

          (out/'.nojekyll').write_text('',encoding='utf-8')
          print(f'Pages mirror built at {out} with {len(refs)} fallback image references covered.')
          PY

      - name: Sanity-check Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/assets/site.css
          test -f _site/assets/site.js
          grep -q 'From Material' _site/index.html
          grep -q 'TONGJUN' _site/index.html
          grep -q 'Request a Quote' _site/index.html
          grep -q '/tongjun-overseas/rfq' _site/index.html
          echo 'PASS: visual-recovery homepage and Pages paths validated.'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
