name: R15.25 External Production Preflight

on:
  push:
    branches:
      - feat/v34.152-r15.24-home-hero-background
    paths:
      - .github/workflows/r15-25-external-preflight.yml

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v34.152-r15.25-prelaunch
          fetch-depth: 1
      - name: Read-only production preflight
        run: npm run check:production
