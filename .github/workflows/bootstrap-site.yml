name: Bootstrap ExoticAlloyCN site

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild V16 snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/READY
          cat .bootstrap/chunk-* > /tmp/exoticalloycn-site-v16.b64
          base64 -d /tmp/exoticalloycn-site-v16.b64 > /tmp/exoticalloycn-site-v16.zip
          rm -rf /tmp/exoticalloycn-v16
          mkdir -p /tmp/exoticalloycn-v16
          unzip -q /tmp/exoticalloycn-site-v16.zip -d /tmp/exoticalloycn-v16
          test -f /tmp/exoticalloycn-v16/exoticalloycn-site-v16/index.html
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/bootstrap-site.yml' \
            --exclude='.bootstrap/' \
            /tmp/exoticalloycn-v16/exoticalloycn-site-v16/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-site.yml

      - name: Validate site
        shell: bash
        run: |
          npm run check

      - name: Commit V16 source snapshot
        shell: bash
        run: |
          git config user.name 'Tongjun Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: sync ExoticAlloyCN V16 source snapshot'
          git push origin HEAD:main
