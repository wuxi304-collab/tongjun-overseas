name: Account intelligence guard

on:
  pull_request:
    paths:
      - "skills/tongjun-account-intelligence/**"
      - "scripts/osint-normalize.js"
      - "scripts/osint-normalize.test.js"
      - "package.json"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - "skills/tongjun-account-intelligence/**"
      - "scripts/osint-normalize.js"
      - "scripts/osint-normalize.test.js"
      - "package.json"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run check:account-intel
