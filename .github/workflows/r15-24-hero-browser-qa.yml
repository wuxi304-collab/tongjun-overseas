name: R15.24 Hero Browser QA

on:
  push:
    branches:
      - feat/v34.152-r15.24-home-hero-background
    paths:
      - .github/workflows/r15-24-hero-browser-qa.yml
      - assets/r15-24-home-hero.css
      - index.html

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v34.152-r15.24-home-hero-background

      - name: Resolve Chrome
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null; then
            echo "CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            sudo apt-get update -y
            sudo apt-get install -y chromium
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          fi

      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0

      - name: Start local site
        run: |
          python3 -m http.server 8123 >/tmp/tongjun-http.log 2>&1 &
          echo $! >/tmp/tongjun-http.pid
          sleep 2

      - name: Run exact viewport HERO QA
        run: |
          cat > hero-qa.mjs <<'JS'
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({
            executablePath: process.env.CHROME,
            headless: true,
            args: ['--no-sandbox']
          });

          const cases = [
            {name:'1440', width:1440, height:900, dpr:1},
            {name:'1440-dpr2', width:1440, height:900, dpr:2},
            {name:'390', width:390, height:844, dpr:1},
          ];

          for (const c of cases) {
            const context = await browser.newContext({
              viewport: {width:c.width, height:c.height},
              deviceScaleFactor:c.dpr
            });
            const page = await context.newPage();
            const heroRequests = [];
            page.on('request', req => {
              if (req.url().includes('hero-special-metals-r15-24')) heroRequests.push(req.url());
            });
            await page.goto('http://127.0.0.1:8123/', {waitUntil:'networkidle'});

            const q = await page.evaluate(() => {
              const hero=document.querySelector('.hero');
              const h1=document.querySelector('.hero h1');
              const lead=document.querySelector('.hero .lead');
              const dock=document.querySelector('.hero-decision-dock');
              const proof=document.querySelector('.hero-proofline');
              const style=hero ? getComputedStyle(hero) : null;
              return {
                viewport:[innerWidth,innerHeight],
                dpr:devicePixelRatio,
                scrollWidth:document.documentElement.scrollWidth,
                overflowX:Math.max(0,document.documentElement.scrollWidth-innerWidth),
                hero:hero?Math.round(hero.getBoundingClientRect().height):null,
                h1:h1?Math.round(h1.getBoundingClientRect().height):null,
                lead:lead?Math.round(lead.getBoundingClientRect().height):null,
                dock:dock?Math.round(dock.getBoundingClientRect().height):null,
                proof:proof?Math.round(proof.getBoundingClientRect().height):null,
                heroBg:style?.backgroundImage || null,
                heroPos:style?.backgroundPosition || null,
                heroSize:style?.backgroundSize || null
              };
            });

            q.requests = [...new Set(heroRequests)];
            console.log('QAJSON', c.name, JSON.stringify(q));

            if (q.viewport[0] !== c.width) throw new Error(c.name+' viewport mismatch '+q.viewport[0]);
            if (q.overflowX !== 0) throw new Error(c.name+' overflowX '+q.overflowX);
            if (q.hero < 600) throw new Error(c.name+' hero too short '+q.hero);

            if (c.name === '390') {
              if (!q.heroBg.includes('hero-special-metals-r15-24-mobile.webp')) {
                throw new Error('390 did not select mobile HERO');
              }
              if (!q.heroPos.includes('67% 48%')) {
                throw new Error('390 HERO position overridden: '+q.heroPos);
              }
            } else {
              if (!q.heroBg.includes('image-set')) throw new Error(c.name+' missing density image-set');
              if (!q.heroPos.includes('58% 51%')) {
                throw new Error(c.name+' HERO position overridden: '+q.heroPos);
              }
            }

            await page.screenshot({path:'/tmp/hero-'+c.name+'.png', fullPage:false});
            await context.close();
          }

          await browser.close();
          JS
          node hero-qa.mjs

      - name: Verify screenshot outputs
        run: |
          file /tmp/hero-1440.png /tmp/hero-1440-dpr2.png /tmp/hero-390.png
          ls -lh /tmp/hero-*.png
