name: V34.152 workflow staging

on:
  workflow_dispatch:
  push:
    branches:
      - v34.152-workflow-staging
    paths:
      - '.sync/v34.152-workflow-staging/READY'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v34.152-workflow-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic V34.152 staging delta
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-v34-152.py
          python scripts/refine-v34-152-release.py
      - name: Validate V34.152 delta only
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/site.js
          node --check assets/polish.js
          node --check api/rfq.js
          node scripts/test-rfq.js
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('rfq.html','utf8');
          const js=fs.readFileSync('assets/polish.js','utf8');
          const required=[
            'technicalReviewControl','quote_assumptions','deviation_status','deviation_register',
            'alternate_route_permission','certificate_responsibility','inspection_responsibility',
            'release_status','release_checklist','technical_review_plan'
          ];
          for(const token of required){
            if(!html.includes(token)) throw new Error(`missing RFQ workflow token: ${token}`);
          }
          for(const name of required.filter(x=>x!=='technicalReviewControl')){
            const count=(html.match(new RegExp(`name=["']${name}["']`,'g'))||[]).length;
            if(count!==1) throw new Error(`expected one ${name} control, found ${count}`);
          }
          const ids=[...html.matchAll(/\sid=["']([^"']+)["']/g)].map(m=>m[1]);
          const dup=[...new Set(ids.filter((id,i)=>ids.indexOf(id)!==i))];
          if(dup.length) throw new Error(`duplicate RFQ ids: ${dup.join(', ')}`);
          const semantics=[
            'const hardReady=technical&&assumptions&&alternate&&evidenceAssigned&&deviations',
            "certOwner==='to-be-agreed'||inspectionOwner==='to-be-agreed'",
            "legacyState.textContent=status==='QUALIFIED BASIS'?'Qualified basis':status==='QUALIFIED WITH CONDITIONS'?'Conditional':'Not released'"
          ];
          for(const token of semantics){if(!js.includes(token))throw new Error(`release semantic missing: ${token}`)}
          console.log('PASS: RFQ controls, unique IDs and release-authority semantics.');
          NODE
          grep -q 'quote_assumptions:2500' api/rfq.js
          grep -q 'Release Status:' assets/site.js
          grep -q 'V34.152 STAGING' assets/polish.css
          grep -q 'V34.152 R2' assets/polish.js
          echo 'PASS: V34.152 staging delta validated. Full site / asset gates remain reserved for authoritative V34.151 source.'
      - name: Commit validated staging delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rfq.html assets/site.js assets/polish.css assets/polish.js api/rfq.js scripts/test-rfq.js
          if git diff --cached --quiet; then
            echo 'No V34.152 staging changes required.'
            exit 0
          fi
          git commit -m 'fix: align V34.152 qualified-offer release authority'
          git push origin HEAD:v34.152-workflow-staging
