name: V34.152 workflow staging

on:
  workflow_dispatch:
  push:
    branches:
      - v34.152-workflow-staging
    paths:
      - '.sync/v34.152-workflow-staging/READY'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v34.152-workflow-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic V34.152 staging delta
        run: python scripts/apply-v34-152.py
      - name: Validate RFQ workflow delta
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/site.js
          node --check assets/polish.js
          node --check api/rfq.js
          node scripts/test-rfq.js
          node scripts/validate-site.js
          node scripts/audit-launch.js
          grep -q 'technicalReviewControl' rfq.html
          grep -q 'quote_assumptions' api/rfq.js
          grep -q 'release_status' assets/site.js
          grep -q 'V34.152 STAGING' assets/polish.css
          echo 'PASS: V34.152 staging workflow controls validated on overlay branch.'
      - name: Commit validated staging delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rfq.html assets/site.js assets/polish.css assets/polish.js api/rfq.js scripts/test-rfq.js
          if git diff --cached --quiet; then
            echo 'No V34.152 staging changes required.'
            exit 0
          fi
          git commit -m 'feat: stage V34.152 RFQ technical-review qualified-offer chain'
          git push origin HEAD:v34.152-workflow-staging
