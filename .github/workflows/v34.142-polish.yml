name: V34.142 page-level polish

on:
  workflow_dispatch:
  push:
    branches:
      - v34.142-ui-polish
    paths:
      - '.sync/v34.142-ui-polish/READY'

permissions:
  contents: write

jobs:
  apply-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v34.142-ui-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic V34.142 refinements
        run: python scripts/apply-v34-142.py
      - name: Validate JavaScript
        run: node --check assets/polish.js
      - name: Validate V34 release gates
        run: npm run check
      - name: Commit validated V34.142 polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/polish.css assets/polish.js
          if git diff --cached --quiet; then
            echo 'No polish changes required.'
            exit 0
          fi
          git commit -m 'design: apply V34.142 page-level visual review pass'
          git push origin HEAD:v34.142-ui-polish
