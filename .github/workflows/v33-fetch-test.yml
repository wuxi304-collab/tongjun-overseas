name: V33 transfer bridge inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v33-fetch-test.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect V33 bridge payload
        shell: bash
        run: |
          set -euxo pipefail
          u='https://tongjun-v33-transfer-probe-q0gspz0jt-s30408s-projects.vercel.app/v33-canonical-source.tar.gz'
          curl -L --max-time 30 -sS -D /tmp/headers.txt -o /tmp/v33.bin "$u"
          cat /tmp/headers.txt
          file /tmp/v33.bin || true
          wc -c /tmp/v33.bin
          sha256sum /tmp/v33.bin
          echo '--- first 512 bytes ---'
          head -c 512 /tmp/v33.bin | strings || true
          echo '--- html markers ---'
          grep -Eo '<title>[^<]*|data-final-release="[^"]*|Special Metals[^<]*' /tmp/v33.bin | head -20 || true
