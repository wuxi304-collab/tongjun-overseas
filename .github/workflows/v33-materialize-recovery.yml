name: V33 materialize recovery

on:
  push:
    branches: [v33-materialized-recovery]
    paths:
      - '.sync/v33/READY3'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild V33 archive
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/v33/chunk*.b64 | tr -d '\r\n\t ' > /tmp/v33.clean.b64
          echo "base64 chars: $(wc -c < /tmp/v33.clean.b64)"
          rem=$(( $(wc -c < /tmp/v33.clean.b64) % 4 ))
          echo "base64 modulo: $rem"
          test "$rem" -eq 0
          if LC_ALL=C grep -q '[^A-Za-z0-9+/=]' /tmp/v33.clean.b64; then
            echo 'Invalid non-base64 characters remain after whitespace normalization.'
            exit 1
          fi
          base64 -d /tmp/v33.clean.b64 > /tmp/v33.tar.gz
          file /tmp/v33.tar.gz
          sha256sum /tmp/v33.tar.gz
          tar -tzf /tmp/v33.tar.gz > /tmp/v33.inventory
          echo "archive files: $(wc -l < /tmp/v33.inventory)"
          head -40 /tmp/v33.inventory
          rm -rf /tmp/v33-src
          mkdir -p /tmp/v33-src
          tar -xzf /tmp/v33.tar.gz -C /tmp/v33-src
      - name: Materialize and validate
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/v33-src
          if [ "$(find "$src" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && [ ! -f "$src/package.json" ]; then
            src="$(find "$src" -mindepth 1 -maxdepth 1 -type d | head -1)"
          fi
          test -f "$src/package.json"
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.sync/' "$src"/ ./
          npm run check
      - name: Commit recovered V33 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tongjun V33 Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes.'
            exit 0
          fi
          git commit -m 'sync: materialize recovered V33 source'
          git push origin HEAD:v33-materialized-recovery
