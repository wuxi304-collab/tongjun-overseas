name: R15.24 Hero 4K Materialize

on:
  push:
    branches:
      - feat/v34.152-r15.24-home-hero-background
    paths:
      - .github/workflows/r15-24-hero-4k.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v34.152-r15.24-home-hero-background

      - name: Fetch original 5K industrial photograph
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://images.pexels.com/photos/8940223/pexels-photo-8940223.jpeg?cs=srgb&fm=jpg' \
            -o /tmp/hero-source.jpg
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height \
            -of csv=s=x:p=0 /tmp/hero-source.jpg

      - name: Build desktop 4K and mobile portrait derivatives
        run: |
          set -euo pipefail
          mkdir -p assets/images

          ffmpeg -hide_banner -loglevel error -i /tmp/hero-source.jpg -frames:v 1 \
            -vf "scale=3840:2160:force_original_aspect_ratio=increase:flags=lanczos,crop=3840:2160" \
            -c:v libwebp -preset picture -quality 88 -compression_level 6 -y \
            assets/images/hero-special-metals-r15-24-4k.webp

          ffmpeg -hide_banner -loglevel error -i /tmp/hero-source.jpg -frames:v 1 \
            -vf "scale=1440:1800:force_original_aspect_ratio=increase:flags=lanczos,crop=1440:1800" \
            -c:v libwebp -preset picture -quality 88 -compression_level 6 -y \
            assets/images/hero-special-metals-r15-24-mobile.webp

          ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
            -of csv=s=x:p=0 assets/images/hero-special-metals-r15-24-4k.webp
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
            -of csv=s=x:p=0 assets/images/hero-special-metals-r15-24-mobile.webp
          ls -lh assets/images/hero-special-metals-r15-24-*.webp

      - name: Commit controlled HERO derivatives
        run: |
          set -euo pipefail
          git config user.name 'tongjun-visual-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/images/hero-special-metals-r15-24-4k.webp \
                  assets/images/hero-special-metals-r15-24-mobile.webp
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'assets: materialize R15.24 4K hero derivatives [skip ci]'
          git push
