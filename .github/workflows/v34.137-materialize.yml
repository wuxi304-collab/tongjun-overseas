name: V34.137 full-source materializer

on:
  push:
    branches: [v34.137-full-source]
    paths:
      - '.sync/v34.137/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify V34.137 archive
        shell: bash
        run: |
          set -euo pipefail
          b64=/tmp/exoticalloycn-v34.137.tar.xz.b64
          out=/tmp/exoticalloycn-v34.137.tar.xz
          : > "$b64"
          for f in .sync/v34.137/part-*.b64; do cat "$f" >> "$b64"; done
          base64 -d "$b64" > "$out"
          echo "e4a1561445c54960fbc828771a1ce280235a785611511146acb548448e4ce523  $out" | sha256sum -c -
          rm -rf /tmp/v34.137-materialized
          mkdir -p /tmp/v34.137-materialized
          tar -xJf "$out" -C /tmp/v34.137-materialized

      - name: Materialize complete source tree and run gates
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.sync/' \
            /tmp/v34.137-materialized/ ./
          npm run check

      - name: Commit validated V34.137 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tongjun V34.137 Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized source changes to commit."
            exit 0
          fi
          git commit -m "sync: materialize validated V34.137 full source"
          git push origin HEAD:v34.137-full-source
