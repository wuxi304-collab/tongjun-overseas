name: V33 materialize

on:
  push:
    branches: [v33-upload]
    paths:
      - '.sync/v33zst/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v33-upload
          fetch-depth: 0

      - name: Rebuild and verify V33 canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f .sync/v33zst/READY
          test "$(find .sync/v33zst -maxdepth 1 -type f -name 'part*.b64' | wc -l)" = '105'
          cat .sync/v33zst/part*.b64 | base64 -d > /tmp/v33.zip.zst
          zstd -q -d -f /tmp/v33.zip.zst -o /tmp/v33.zip
          test "$(wc -c < /tmp/v33.zip)" = '1356200'
          echo '2099310f2d3756955d9a85161d2212bca0de9e1101cd3d7eba4d9cf4c3728494  /tmp/v33.zip' | sha256sum -c -
          unzip -tq /tmp/v33.zip
          rm -rf /tmp/v33-out
          mkdir -p /tmp/v33-out
          unzip -q /tmp/v33.zip -d /tmp/v33-out
          test -d /tmp/v33-out/exoticalloycn-v33
          test "$(find /tmp/v33-out/exoticalloycn-v33 -type f | wc -l)" = '157'
          test ! -e /tmp/v33-out/exoticalloycn-v33/.sync
          test -f /tmp/v33-out/exoticalloycn-v33/index.html
          test -d /tmp/v33-out/exoticalloycn-v33/assets
          test -d /tmp/v33-out/exoticalloycn-v33/scripts
          test -d /tmp/v33-out/exoticalloycn-v33/api
          test -f /tmp/v33-out/exoticalloycn-v33/vercel.json
          test -f /tmp/v33-out/exoticalloycn-v33/manifest.webmanifest
          test -f /tmp/v33-out/exoticalloycn-v33/sitemap.xml
          test -f /tmp/v33-out/exoticalloycn-v33/robots.txt

      - name: Validate canonical source before materialization
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v33-out/exoticalloycn-v33
          npm run check
          test "$(node -p "require('./package.json').version")" = '33.0.0'
          test -f RELEASE_V33.md
          grep -q 'data-final-release="v33"' index.html
          test -z "$(find . -type f \( -name '*.b64' -o -name '*.hex' -o -name '*.bin' -o -name READY \) -print -quit)"

      - name: Materialize canonical V33 into staging branch
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/v33-materialize.yml' \
            /tmp/v33-out/exoticalloycn-v33/ ./
          rm -rf .sync
          npm run check
          test "$(node -p "require('./package.json').version")" = '33.0.0'
          test "$(find . -type f -not -path './.git/*' -not -path './.github/workflows/v33-materialize.yml' | wc -l)" = '157'

      - name: Commit materialized V33 source to v33-upload only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tongjun-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit.'
            exit 0
          fi
          git commit -m 'site: materialize verified V33 canonical source'
          git push origin HEAD:v33-upload
