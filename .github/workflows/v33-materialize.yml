name: V33 canonical publish

on:
  push:
    branches: [v33-upload]
    paths:
      - '.sync/v33-transfer/url.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v33-upload
          fetch-depth: 0

      - name: Download and prove canonical V33 ZIP
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat .sync/v33-transfer/url.txt)"
          test -n "$URL"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 "$URL" -o /tmp/v33.zip
          test "$(wc -c < /tmp/v33.zip)" = '1356200'
          echo '2099310f2d3756955d9a85161d2212bca0de9e1101cd3d7eba4d9cf4c3728494  /tmp/v33.zip' | sha256sum -c -
          unzip -tq /tmp/v33.zip
          rm -rf /tmp/v33-out
          mkdir -p /tmp/v33-out
          unzip -q /tmp/v33.zip -d /tmp/v33-out
          test -d /tmp/v33-out/exoticalloycn-v33
          test "$(find /tmp/v33-out/exoticalloycn-v33 -type f | wc -l)" = '157'
          test ! -e /tmp/v33-out/exoticalloycn-v33/.sync
          test ! -e /tmp/v33-out/exoticalloycn-v33/.github
          test -f /tmp/v33-out/exoticalloycn-v33/index.html
          test -d /tmp/v33-out/exoticalloycn-v33/assets
          test -d /tmp/v33-out/exoticalloycn-v33/scripts
          test -d /tmp/v33-out/exoticalloycn-v33/api
          test -f /tmp/v33-out/exoticalloycn-v33/vercel.json
          test -f /tmp/v33-out/exoticalloycn-v33/manifest.webmanifest
          test -f /tmp/v33-out/exoticalloycn-v33/sitemap.xml
          test -f /tmp/v33-out/exoticalloycn-v33/robots.txt
          (cd /tmp/v33-out/exoticalloycn-v33 && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/v33-canonical.manifest)

      - name: Validate canonical V33 before touching repository source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v33-out/exoticalloycn-v33
          npm run check
          test "$(node -p "require('./package.json').version")" = '33.0.0'
          test -f RELEASE_V33.md
          grep -q 'data-final-release="v33"' index.html
          test -z "$(find . -type f \( -name '*.b64' -o -name '*.hex' -o -name '*.bin' -o -name READY \) -print -quit)"

      - name: Materialize exact V33 tree into staging branch
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/v33-out/exoticalloycn-v33/ ./
          test ! -e .sync
          test ! -e .github
          test "$(find . -type f -not -path './.git/*' | wc -l)" = '157'
          npm run check
          (find . -type f -not -path './.git/*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/v33-staging.manifest)
          cmp /tmp/v33-canonical.manifest /tmp/v33-staging.manifest
          git config user.name 'tongjun-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'site: materialize verified V33 canonical source'
          git push origin HEAD:v33-upload
          echo "STAGING_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Publish verified V33 tree to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_PARENT="$(git rev-parse origin/main)"
          MAIN_COMMIT="$(printf '%s\n' 'site: publish verified V33 canonical source' | git commit-tree "$SOURCE_TREE" -p "$MAIN_PARENT")"
          git push origin "$MAIN_COMMIT:refs/heads/main"
          echo "MAIN_COMMIT=$MAIN_COMMIT" >> "$GITHUB_ENV"

      - name: Final fresh-checkout verification from GitHub main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN_COMMIT"
          rm -rf /tmp/main-check
          git worktree add --detach /tmp/main-check origin/main
          cd /tmp/main-check
          test "$(find . -type f -not -path './.git/*' | wc -l)" = '157'
          test ! -e .sync
          test ! -e .github
          test "$(node -p "require('./package.json').version")" = '33.0.0'
          npm run check
          find . -type f -not -path './.git/*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/v33-main.manifest
          cmp /tmp/v33-canonical.manifest /tmp/v33-main.manifest
          echo "FINAL_MAIN_SHA=$MAIN_COMMIT"
          echo 'V33_CANONICAL_PUBLISH=PASS'
