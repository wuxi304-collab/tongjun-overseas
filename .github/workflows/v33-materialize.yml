name: V33 materialize

on:
  push:
    branches: [v33-upload]
    paths:
      - '.sync/v33zip/**'
      - '.github/workflows/v33-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v33-upload
          fetch-depth: 0
      - name: Rebuild and verify V33 canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -d .sync/v33zip
          cat .sync/v33zip/part*.b64 | base64 -d > /tmp/v33.zip
          echo '2099310f2d3756955d9a85161d2212bca0de9e1101cd3d7eba4d9cf4c3728494  /tmp/v33.zip' | sha256sum -c -
          rm -rf /tmp/v33-out
          mkdir -p /tmp/v33-out
          unzip -q /tmp/v33.zip -d /tmp/v33-out
          test -d /tmp/v33-out/exoticalloycn-v33
      - name: Materialize canonical source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.sync/' \
            --exclude='.github/workflows/v33-materialize.yml' \
            /tmp/v33-out/exoticalloycn-v33/ ./
          rm -rf .sync/v33zip
          node --check api/rfq.js
          node --check assets/site.js
          npm run check
          test "$(node -p "require('./package.json').version")" = '33.0.0'
          test -f RELEASE_V33.md
          grep -q 'data-final-release="v33"' index.html
      - name: Commit materialized V33 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tongjun-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit.'
            exit 0
          fi
          git commit -m 'site: materialize V33 pre-launch final candidate'
          git push origin HEAD:v33-upload
