name: R15.25 Production Screenshot Export

on:
  push:
    branches:
      - feat/v34.152-r15.24-home-hero-background
    paths:
      - .github/workflows/r15-25-production-screenshots.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v34.152-r15.25-launch-candidate
          fetch-depth: 0

      - name: Build production artifact
        run: npm run build:production

      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0

      - name: Start production artifact
        run: |
          python3 -m http.server 8123 --directory _prod >/tmp/http.log 2>&1 &
          sleep 2

      - name: Render final production screenshots
        run: |
          mkdir -p preview/r15-25-production
          cat > final-shot.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          for(const c of [
            {name:'desktop-1440',width:1440,height:1000,dpr:1},
            {name:'mobile-390',width:390,height:844,dpr:1}
          ]){
            const ctx=await browser.newContext({viewport:{width:c.width,height:c.height},deviceScaleFactor:c.dpr});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:8123/',{waitUntil:'networkidle'});
            await page.screenshot({path:'preview/r15-25-production/'+c.name+'.png',fullPage:false});
            await ctx.close();
          }
          await browser.close();
          JS
          node final-shot.mjs
          file preview/r15-25-production/*.png

      - name: Publish QA screenshot branch
        run: |
          git config user.name 'tongjun-preview-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f preview/r15-25-production/desktop-1440.png preview/r15-25-production/mobile-390.png
          git commit -m 'qa: R15.25 production candidate screenshots'
          git push -f origin HEAD:qa/r15.25-launch-candidate-screenshots
