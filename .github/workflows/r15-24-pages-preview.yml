name: R15.24 Homepage Visual Preview

on:
  push:
    branches:
      - feat/v34.152-r15.24-home-hero-final
    paths:
      - .github/workflows/r15-24-pages-preview.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v34.152-r15.24-home-hero-final
          fetch-depth: 1

      - uses: actions/configure-pages@v5

      - name: Build static visual preview
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a *.html assets _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          base='/tongjun-overseas'
          for p in Path('_site').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              for a in ('href','src','action'):
                  s=s.replace(f'{a}="/',f'{a}="{base}/')
              s=s.replace(f'{base}//',f'{base}/')
              p.write_text(s,encoding='utf-8')
          PY
          test -f _site/index.html
          test -f _site/assets/r15-24-home-hero.css
          test -f _site/assets/images/hero-special-metals-r15-24.webp
          test -f _site/assets/images/hero-special-metals-r15-24-4k.webp
          test -f _site/assets/images/hero-special-metals-r15-24-mobile.webp

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy visual preview
        id: deployment
        uses: actions/deploy-pages@v4
