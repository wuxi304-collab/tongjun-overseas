name: V26 source rehydrate

on:
  push:
    branches: [main]
    paths:
      - '.sync/v26/**'

permissions:
  contents: write

jobs:
  rehydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check ready marker
        id: ready
        shell: bash
        run: |
          if [ -f .sync/v26/READY ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - name: Rehydrate validated V26 source tree
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          cat .sync/v26/chunk_* | tr -d '\n' | base64 -d > /tmp/v26-public-tree.tar.gz
          tar -xzf /tmp/v26-public-tree.tar.gz -C .
          rm -rf .sync/v26
          rm -f .github/workflows/v26-rehydrate.yml
          git config user.name 'tongjun-source-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'site: rehydrate validated V26 source mirror'
          git push origin HEAD:main
